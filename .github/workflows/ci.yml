name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and escape tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bubblewrap, pasta, nftables, shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends bubblewrap passt nftables shellcheck
          # Ubuntu's AppArmor blocks unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe nf_tables

      - name: shellcheck
        run: shellcheck bin/agent-jail

      - name: Install test tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt

      - name: ruff
        run: .venv/bin/ruff check tests

      - name: Escape tests
        run: .venv/bin/pytest -v tests

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
