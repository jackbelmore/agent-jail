  <rect x="612" y="24" width="564" height="492" rx="16" fill="#1e293b" stroke="#22c55e" stroke-opacity=".5" stroke-width="2"/>
  <text x="306" y="66" text-anchor="middle" font-size="24" font-weight="800" fill="#fda4af">Without agent-jail</text>
  <text x="306" y="94" text-anchor="middle" font-size="16" fill="#cbd5e1">The agent can reach everything you can</text>
  <text x="894" y="66" text-anchor="middle" font-size="24" font-weight="800" fill="#86efac">With agent-jail</text>
  <text x="894" y="94" text-anchor="middle" font-size="16" fill="#cbd5e1">It gets this project and the internet. That's all.</text>

