<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t">
  <title id="t">Without agent-jail, the agent can reach everything you can: SSH keys, saved passwords, other projects, cloud logins, your home router, apps on this PC and your terminal. With agent-jail, it gets this project and the public internet, and everything else is locked outside.</title>
  <defs><style>
    text { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .lab { font-size: 15px; font-weight: 600; }
    .bad { fill: none; stroke: #fda4af; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .badbg { fill: #4c0519; stroke: #f43f5e; stroke-width: 2; } .badt { fill: #fecdd3; stroke: none; }
    .off { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .offbg { fill: #334155; } .offt { fill: #94a3b8; stroke: none; }
    .good { fill: none; stroke: #86efac; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .goodbg { fill: #052e16; stroke: #22c55e; stroke-width: 2; } .goodt { fill: #bbf7d0; stroke: none; }
  </style>
  <g id="lock"><rect x="-9" y="-3" width="18" height="14" rx="3" fill="#f43f5e"/><path d="M-5.5 -3 v-4 a5.5 5.5 0 0 1 11 0 v4" fill="none" stroke="#f43f5e" stroke-width="3"/></g>
  </defs>
