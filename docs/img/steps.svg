<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t">
  <title id="t">Get started in three steps: 1, install once with ./install.sh. 2, open your project with cd. 3, start an agent with agent-jail.</title>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .num { font-size: 26px; font-weight: 800; fill: #0f172a; }
      .h { font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 17px; }
      .p { font-size: 15px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1200" height="230" rx="20" fill="#0f172a"/>

  <g transform="translate(24 24)">
    <rect width="350" height="182" rx="16" fill="#1e293b"/>
    <circle cx="48" cy="48" r="26" fill="#2dd4bf"/><text class="num" x="48" y="57" text-anchor="middle">1</text>
    <text class="h" x="90" y="56">Install it once</text>
    <rect x="24" y="92" width="302" height="40" rx="8" fill="#0f172a"/>
    <text class="code" x="40" y="118" fill="#5eead4">./install.sh</text>
    <text class="p" x="24" y="160">It checks your system too.</text>
  </g>
  <path d="M386 115 h28 m-10 -10 l10 10 l-10 10" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(425 24)">
    <rect width="350" height="182" rx="16" fill="#1e293b"/>
    <circle cx="48" cy="48" r="26" fill="#38bdf8"/><text class="num" x="48" y="57" text-anchor="middle">2</text>
    <text class="h" x="90" y="56">Open your project</text>
    <rect x="24" y="92" width="302" height="40" rx="8" fill="#0f172a"/>
    <text class="code" x="40" y="118" fill="#7dd3fc">cd ~/Projects/my-app</text>
    <text class="p" x="24" y="160">The agent can change only this folder.</text>
  </g>
  <path d="M787 115 h28 m-10 -10 l10 10 l-10 10" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(826 24)">
    <rect width="350" height="182" rx="16" fill="#1e293b"/>
    <circle cx="48" cy="48" r="26" fill="#a78bfa"/><text class="num" x="48" y="57" text-anchor="middle">3</text>
    <text class="h" x="90" y="56">Start an agent</text>
    <rect x="24" y="92" width="302" height="40" rx="8" fill="#0f172a"/>
    <text class="code" x="40" y="118" fill="#c4b5fd">agent-jail</text>
    <text class="p" x="24" y="160">Pick one from the list. Done.</text>
  </g>
</svg>
