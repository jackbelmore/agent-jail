<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t">
  <title id="t">agent-jail: an AI coding agent works inside a glowing box with your project folder, while your SSH keys, passwords, home network and other projects stay locked outside</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .chip { fill: #1e293b; stroke: #334155; }
      .chipt { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .lab { fill: #94a3b8; font-size: 15px; font-weight: 600; }
      .ico { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="lock">
      <rect x="-9" y="-3" width="18" height="14" rx="3" fill="#f43f5e"/>
      <path d="M-5.5 -3 v-4 a5.5 5.5 0 0 1 11 0 v4" fill="none" stroke="#f43f5e" stroke-width="3"/>
    </g>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <g fill="#334155">
    <circle cx="640" cy="40" r="2"/><circle cx="700" cy="380" r="2"/><circle cx="1170" cy="210" r="2"/>
    <circle cx="560" cy="360" r="2"/><circle cx="1010" cy="30" r="2"/><circle cx="760" cy="200" r="2"/>
  </g>

  <!-- words -->
  <text x="70" y="165" font-size="76" font-weight="800" fill="#f8fafc">agent-<tspan fill="url(#word)">jail</tspan></text>
  <text x="72" y="222" font-size="25" fill="#cbd5e1">Let AI coding agents change your project,</text>
  <text x="72" y="256" font-size="25" fill="#cbd5e1">and nothing else on your computer.</text>

  <g transform="translate(72 290)">
    <rect class="chip" width="118" height="34" rx="17"/><text class="chipt" x="59" y="22" text-anchor="middle">Claude Code</text>
    <rect class="chip" x="128" width="74" height="34" rx="17"/><text class="chipt" x="165" y="22" text-anchor="middle">Codex</text>
    <rect class="chip" x="212" width="114" height="34" rx="17"/><text class="chipt" x="269" y="22" text-anchor="middle">Antigravity</text>
    <rect class="chip" x="336" width="90" height="34" rx="17"/><text class="chipt" x="381" y="22" text-anchor="middle">Copilot</text>
    <rect class="chip" x="436" width="96" height="34" rx="17" fill="#134e4a" stroke="#2dd4bf"/><text class="chipt" x="484" y="22" text-anchor="middle" fill="#5eead4">+4 more</text>
  </g>
  <text x="72" y="368" font-size="16" fill="#94a3b8">For Linux · one command · free and open source (MIT)</text>

  <!-- the jail -->
  <rect x="828" y="102" width="224" height="214" rx="26" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="14"/>
  <rect x="828" y="102" width="224" height="214" rx="26" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-width="4"/>
  <text x="940" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#5eead4" letter-spacing="2">THE JAIL</text>

  <!-- robot -->
  <g transform="translate(890 215)">
    <line x1="0" y1="-58" x2="0" y2="-44" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="0" cy="-62" r="7" fill="#fbbf24"/>
    <rect x="-34" y="-44" width="68" height="52" rx="14" fill="#e2e8f0"/>
    <rect x="-24" y="-32" width="48" height="26" rx="9" fill="#0f172a"/>
    <circle cx="-11" cy="-19" r="5" fill="#2dd4bf"/><circle cx="11" cy="-19" r="5" fill="#2dd4bf"/>
    <rect x="-28" y="14" width="56" height="44" rx="10" fill="#a78bfa"/>
    <circle cx="0" cy="34" r="7" fill="#ede9fe"/>
    <line x1="-28" y1="24" x2="-44" y2="40" stroke="#a78bfa" stroke-width="8" stroke-linecap="round"/>
    <line x1="28" y1="24" x2="44" y2="40" stroke="#a78bfa" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- project folder -->
  <g transform="translate(962 205)">
    <path d="M0 8 a6 6 0 0 1 6 -6 h22 l8 8 h30 a6 6 0 0 1 6 6 v44 a6 6 0 0 1 -6 6 h-60 a6 6 0 0 1 -6 -6 z" fill="#fbbf24"/>
    <rect x="0" y="18" width="72" height="48" rx="6" fill="#fcd34d"/>
    <text x="36" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">my-app</text>
  </g>

  <!-- outside: locked away -->
  <g transform="translate(775 70)">
    <circle r="32" fill="#1e293b"/>
    <circle cx="-8" cy="0" r="9" class="ico"/><path d="M1 0 h18 M13 0 v7 M19 0 v5" class="ico"/>
    <use href="#lock" x="22" y="18"/>
    <text y="56" text-anchor="middle" class="lab">SSH keys</text>
  </g>
  <g transform="translate(1135 70)">
    <circle r="32" fill="#1e293b"/>
    <path d="M-15 2 L0 -12 L15 2 M-10 -2 v15 h20 v-15" class="ico"/>
    <use href="#lock" x="22" y="18"/>
    <text y="56" text-anchor="middle" class="lab">home network</text>
  </g>
  <g transform="translate(775 330)">
    <circle r="32" fill="#1e293b"/>
    <rect x="-16" y="-9" width="32" height="18" rx="4" class="ico"/>
    <g fill="#64748b"><circle cx="-8" cy="0" r="2.6"/><circle cx="0" cy="0" r="2.6"/><circle cx="8" cy="0" r="2.6"/></g>
    <use href="#lock" x="22" y="18"/>
    <text y="56" text-anchor="middle" class="lab">passwords</text>
  </g>
  <g transform="translate(1135 330)">
    <circle r="32" fill="#1e293b"/>
    <path d="M-15 -9 h9 l4 4 h17 v15 h-30 z" class="ico"/>
    <use href="#lock" x="22" y="18"/>
    <text y="56" text-anchor="middle" class="lab">other projects</text>
  </g>
</svg>
