<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="746" height="508" viewBox="0 0 746 508" role="img" aria-label="The agent-jail picker: six coding agents, whether each is installed, and an offer to install Codex inside the jail">
<style>text{font:14px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;fill:#e6edf3;white-space:pre}.bold{font-weight:700}.cdim{fill:#7d8590}.c32{fill:#3fb950}.c36{fill:#39c5cf}</style>
<rect x="0.5" y="0.5" width="745" height="507" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="26" cy="18" r="6" fill="#ff5f57"/>
<circle cx="46" cy="18" r="6" fill="#febc2e"/>
<circle cx="66" cy="18" r="6" fill="#28c840"/>
<text x="373" y="23" text-anchor="middle" class="cdim">~/Projects/my-app</text>
<text x="20.0" y="62" class="c32">~/Projects/my-app</text>
<text x="171.2" y="62">$ agent-jail</text>
<text x="36.8" y="102" class="bold">agent-jail</text>
<text x="137.6" y="102" class="cdim">run an AI coding agent that can change only this folder</text>
<text x="53.6" y="142" class="cdim">1</text>
<text x="78.8" y="142">Claude Code</text>
<text x="196.4" y="142" class="c32">● installed</text>
<text x="339.2" y="142" class="cdim">~/.local/bin/claude</text>
<text x="36.8" y="162" class="c36">❯</text>
<text x="53.6" y="162" class="cdim">2</text>
<text x="78.8" y="162" class="bold c36">Codex</text>
<text x="196.4" y="162" class="cdim">○ not installed</text>
<text x="339.2" y="162" class="cdim">installs @openai/codex</text>
<text x="53.6" y="182" class="cdim">3</text>
<text x="78.8" y="182">Gemini CLI</text>
<text x="196.4" y="182" class="c32">● installed</text>
<text x="339.2" y="182" class="cdim">~/.local/share/agent-jail/tools/gemini</text>
<text x="53.6" y="202" class="cdim">4</text>
<text x="78.8" y="202">Qwen Code</text>
<text x="196.4" y="202" class="cdim">○ not installed</text>
<text x="339.2" y="202" class="cdim">installs @qwen-code/qwen-code</text>
<text x="53.6" y="222" class="cdim">5</text>
<text x="78.8" y="222">OpenCode</text>
<text x="196.4" y="222" class="c32">● installed</text>
<text x="339.2" y="222" class="cdim">~/.opencode/bin/opencode</text>
<text x="53.6" y="242" class="cdim">6</text>
<text x="78.8" y="242">Continue</text>
<text x="196.4" y="242" class="cdim">○ not installed</text>
<text x="339.2" y="242" class="cdim">installs @continuedev/cli</text>
<text x="53.6" y="262" class="cdim">s</text>
<text x="78.8" y="262">Shell</text>
<text x="196.4" y="262" class="c32">● built in</text>
<text x="339.2" y="262" class="cdim">bash with the jail&#x27;s view, no agent</text>
<text x="36.8" y="302" class="cdim">Folder</text>
<text x="112.4" y="302">~/Projects/my-app</text>
<text x="36.8" y="322" class="cdim">Network</text>
<text x="112.4" y="322">public internet only; not localhost, the LAN or a tailnet</text>
<text x="36.8" y="342" class="cdim">Git</text>
<text x="112.4" y="342">hooks and config read-only</text>
<text x="36.8" y="362" class="cdim">Secrets</text>
<text x="112.4" y="362">no files to hide</text>
<text x="36.8" y="382" class="cdim">Limits</text>
<text x="112.4" y="382">none: no systemd user session to enforce them</text>
<text x="36.8" y="422" class="bold">Codex</text>
<text x="87.2" y="422">is not installed. agent-jail can install @openai/codex into</text>
<text x="36.8" y="442">~/.local/share/agent-jail/tools/codex, with npm running inside a jail too.</text>
<text x="36.8" y="482">Install it now? [Y/n]</text>
<rect x="221.6" y="470" width="8.4" height="17" fill="#e6edf3" opacity="0.8"/>
</svg>
